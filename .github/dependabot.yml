# Version updates are paused. Dependabot must not open pull requests,
# branches, or commits. Vulnerability alerts stay on the Security tab.
# Automated security-fix pull requests are disabled in the repo settings.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
