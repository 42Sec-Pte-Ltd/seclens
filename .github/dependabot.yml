# Keep Go modules and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # codeql-action majors stay manual (init/autobuild/analyze must move together).
    ignore:
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-major"]
